[package]
name = "souffleur-overlay"
version = "0.1.0"
description = "Souffleur AI — Phase-2-Live-Overlay (Tauri, macOS, screen-share-unsichtbar)"
authors = ["Souffleur AI"]
edition = "2021"
rust-version = "1.75"
license = "UNLICENSED"

# Kein separates [lib] — reine Desktop-App (macOS/Apple Silicon), kein Mobile-Target.
[[bin]]
name = "souffleur-overlay"
path = "src/main.rs"

# `unexpected_cfgs` kommt aus der `sel_impl!`-Makro-Expansion der `objc`-Crate (prüft intern
# auf `feature = "cargo-clippy"`, ein veralteter Clippy-Erkennungstrick). Ein lokales
# `#[allow(unexpected_cfgs)]` an der Aufrufstelle (src/macos_window.rs) greift wegen der
# Makro-Hygiene der externen Crate nicht — dieser Crate-weite Lint-Cap ist der dokumentierte,
# funktionierende Workaround (siehe src/macos_window.rs Moduldoku für Details).
[lints.rust]
unexpected_cfgs = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# Nur Klartext-WS ("connect", ohne TLS-Backend) — reicht für ws://localhost:8000 (Default-Ziel,
# siehe network/mod.rs); vermeidet unnötige TLS-Abhängigkeiten ("schlank").
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = "0.3"
# Mikrofon-Capture (Kanal 0 / Coach) — echte, funktionsfähige Implementierung.
cpal = "0.18"
uuid = { version = "1", features = ["v4"] }
# Pin gegen einen Upstream-Bruch: `cookie` 0.18.1 (transitive Abhängigkeit von `wry`) ruft
# `time`s `parse()` noch mit der alten 1-Argument-Signatur auf; `time` >=0.3.51 hat die
# Signatur (undokumentiert breaking innerhalb 0.3.x) auf 2 Argumente geändert. Ohne diesen
# Pin wählt Cargo die neueste `time`-Version und der Build bricht in `cookie` ab.
time = "=0.3.49"

# macOS-only: NSWindow.sharingType = .none (Screen-Share-Unsichtbarkeit) via objc-Runtime.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

# "Schlank" (Konzept-Ziel ~10 MB Tauri-Geist): Größe vor Kompilierzeit priorisieren.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
